<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8f5">
<title>Something I wanted to tell you, Emasha</title>
<style>
  :root { --ink:#38272c; --muted:#806c72; --rose:#ed7891; --deep:#c94f72; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif; background:radial-gradient(ellipse at 12% 15%,#ffe3e8 0,transparent 35%),radial-gradient(ellipse at 90% 85%,#ffe7ce 0,transparent 32%),#fff8f4 }
  .sparkle { position:fixed; color:#e9a2ae; opacity:.6; font-size:22px; animation:float 5s ease-in-out infinite; pointer-events:none }
  .s1{top:12%;left:12%}.s2{top:18%;right:14%;animation-delay:1s}.s3{bottom:15%;left:18%;animation-delay:2s}.s4{bottom:13%;right:12%;animation-delay:.5s}
  @keyframes float { 50%{transform:translateY(-12px) rotate(12deg)} }
  main { width:min(100%,560px); padding:clamp(36px,8vw,64px) clamp(24px,8vw,64px); text-align:center; border:1px solid #f5e5e2; border-radius:30px; background:rgba(255,255,255,.87); box-shadow:0 24px 80px #9b58621c,0 4px 15px #9b58620b; backdrop-filter:blur(12px) }
  .eyebrow { margin:0 0 22px; color:var(--deep); font-size:.76rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase }
  .heart { width:76px;height:76px;margin:0 auto 24px;display:grid;place-items:center;border-radius:25px;background:#fff0f2;font-size:36px;transform:rotate(-5deg);box-shadow:inset 0 0 0 1px #f9dfe4 }
  h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:clamp(2.8rem,11vw,4.2rem); letter-spacing:-.055em; line-height:1.05 }
  h1 span { color:var(--deep); font-style:italic }
  .copy { max-width:390px;margin:24px auto 0;color:var(--muted);font-size:1.08rem;line-height:1.85 }
  .signature { margin:28px 0 0;color:var(--deep);font-family:Georgia,serif;font-size:1.2rem;font-style:italic }
  .reveal { border:0;border-radius:999px;padding:15px 24px;color:white;background:linear-gradient(135deg,#ed7891,#d85879);font:inherit;font-weight:750;cursor:pointer;box-shadow:0 9px 22px #d8587938;transition:transform .18s,box-shadow .18s }
  .reveal:hover { transform:translateY(-2px);box-shadow:0 12px 27px #d8587952 }
  .reveal:focus-visible { outline:3px solid #f1a4b4;outline-offset:3px }
  .note { display:none;animation:appear .55s ease both }
  .note.open { display:block }
  @keyframes appear { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }
  .footer { margin:28px 0 0;color:#aa979b;font-size:.78rem }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<span class="sparkle s1" aria-hidden="true">✦</span><span class="sparkle s2" aria-hidden="true">♡</span><span class="sparkle s3" aria-hidden="true">✧</span><span class="sparkle s4" aria-hidden="true">♡</span>
<main>
  <div class="heart" aria-hidden="true">♡</div>
  <p class="eyebrow">Something I wanted to tell you</p>
  <h1>Hey,<br><span>Emasha</span></h1>
  <button class="reveal" id="reveal" aria-expanded="false" aria-controls="note">Open my little note 💌</button>
  <div class="note" id="note">
    <p class="copy">I like you, and I wanted to be honest about how I feel. There’s no pressure to feel the same—I just wanted you to know. 💛</p>
    <p class="signature">— from someone who thinks you’re pretty wonderful</p>
  </div>
  <p class="footer">Made with a little courage and a lot of heart</p>
</main>
<script>
  const reveal = document.getElementById('reveal');
  const note = document.getElementById('note');
  reveal.addEventListener('click', () => {
    note.classList.add('open');
    reveal.setAttribute('aria-expanded', 'true');
    reveal.textContent = 'A little something from me 💛';
  });
</script>
</body>
</html>
